apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-cleanup-job
  namespace: openshift-gitops
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: openshift-gitops-argocd-application-controller
      restartPolicy: Never
      containers:
        - name: argocd-cleanup
          image: registry.redhat.io/openshift4/ose-cli:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/bash
            - -c
            - |
              set -eo pipefail
              echo "=== ARGOCD CLEANUP JOB - INICIANDO ==="

              # Configuração temporária segura
              export HOME=/tmp
              export ARGOCD_CONFIG_DIR=/tmp/.argocd
              mkdir -p $ARGOCD_CONFIG_DIR
              export KUBECONFIG=/tmp/kubeconfig

              # Login no cluster via ServiceAccount
              api_url=$(oc get Infrastructure cluster -o jsonpath='{.status.apiServerURL}')
              oc login "${api_url}" --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" --insecure-skip-tls-verify

              echo "=== Instalando ArgoCD CLI ==="
              wget -q -O /tmp/argocd https://github.com/argoproj/argo-cd/releases/download/v3.1.9/argocd-linux-amd64
              chmod +x /tmp/argocd

              echo "=== Fazendo login no ArgoCD interno ==="
              /tmp/argocd login $ARGOCD_SERVER \
                --username $ARGOCD_USERNAME \
                --password $ARGOCD_PASSWORD \
                --insecure

              echo "=== Listando apps existentes ==="
              /tmp/argocd app list --output name > /tmp/apps.txt || true
              cat /tmp/apps.txt || true

              if [ ! -s /tmp/apps.txt ]; then
                echo "Nenhum app encontrado. Nada para deletar."
                exit 0
              fi

              echo "=== Deletando apps com cascade + force ==="
              for app in $(cat /tmp/apps.txt); do
                echo "Deletando $app ..."
                /tmp/argocd app delete $app --cascade --yes --force || true
              done

              echo "=== Limpando possíveis finalizers travados ==="
              for app in $(cat /tmp/apps.txt); do
                echo "Removendo finalizers de $app ..."
                oc patch app $app -n openshift-gitops --type=merge -p '{"metadata":{"finalizers":[]}}' || true
              done

              echo "=== ARGOCD CLEANUP CONCLUÍDO ✅ ==="
          env:
            - name: ARGOCD_SERVER
              value: "openshift-gitops-server.openshift-gitops.svc.cluster.local:443"
            - name: ARGOCD_USERNAME
              value: "admin"
            - name: ARGOCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openshift-gitops-cluster
                  key: admin.password
