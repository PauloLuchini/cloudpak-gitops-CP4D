apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-cleanup-job
  namespace: openshift-gitops
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: openshift-gitops-argocd-application-controller
      restartPolicy: Never
      containers:
        - name: argocd-cleanup
          # Imagem base com 'oc', 'bash', 'curl' e suporte a instalação de binários
          image: registry.access.redhat.com/ubi9/ubi:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "=== ARGOCD CLEANUP JOB - INICIANDO ==="

              echo "=== Instalando utilitários necessários (argocd, jq) ==="
              dnf install -y jq curl tar gzip

              echo "=== Instalando ArgoCD CLI ==="
              curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v2.11.0/argocd-linux-amd64
              chmod +x /usr/local/bin/argocd

              echo "=== Fazendo login no cluster com oc ==="
              export KUBECONFIG=/tmp/kubeconfig
              api_url=$(oc get Infrastructure cluster -o jsonpath='{.status.apiServerURL}')
              oc login "${api_url}" \
                --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                --insecure-skip-tls-verify

              echo "=== Fazendo login no ArgoCD interno ==="
              argocd login openshift-gitops-server.openshift-gitops.svc.cluster.local:443 \
                --username admin \
                --password "$(oc get secret openshift-gitops-cluster -n openshift-gitops -o jsonpath='{.data.admin\.password}' | base64 -d)" \
                --insecure

              echo "=== Deletando apps na ordem correta (filhos → pais) ==="
              declare -a APPS=(
                "openshift-gitops/cp4d-platform"
                "openshift-gitops/cp4d-app"
                "openshift-gitops/cp-shared-operators"
                "openshift-gitops/cp-shared-app"
                "openshift-gitops/argo-app"
              )

              for app in "${APPS[@]}"; do
                echo "Deletando $app ..."
                argocd app delete "$app" --cascade --yes || echo "Falha ao deletar $app, tentando remover finalizer..."
                appname=$(echo "$app" | cut -d'/' -f2)
                oc patch application.argoproj.io "$appname" -n openshift-gitops --type merge -p '{"metadata":{"finalizers":null}}' || true
              done

              echo "=== ARGOCD CLEANUP CONCLUÍDO  ==="
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
